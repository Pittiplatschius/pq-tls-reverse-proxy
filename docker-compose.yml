# pq-tls-reverse-proxy/docker-compose.yml
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

services:
  backend-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    networks:
      - backend_net
    restart: unless-stopped

  nginx-proxy-oqs:
    build:
      context: nginx-oqs
      dockerfile: Dockerfile
      args:
        OPENSSL_VERSION: 3.5.0
        NGINX_VERSION: 1.28.0
    container_name: nginx_proxy_oqs
    ports:
      - "4443:443"
    volumes:
      - ./nginx-oqs/nginx_config/conf:/etc/nginx-oqs
      - ./nginx-oqs/nginx_config/ssl:/etc/nginx-oqs/ssl:ro
      - ./nginx-oqs/logs:/var/log/nginx-oqs
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - backend-server
    restart: unless-stopped

  client-oqs:
    build:
      context: client-oqs
      dockerfile: Dockerfile
      args:
        OPENSSL_VERSION: 3.5.0
    container_name: client_oqs
    volumes:
      - ./nginx-oqs/nginx_config/ssl/server.crt:/etc/ssl/certs/proxy_server.crt:ro
    networks:
      - frontend_net
    depends_on:
      - nginx-proxy-oqs
    stdin_open: true
    tty: true

  client-classic:
    build:
      context: ./client-classic
      dockerfile: Dockerfile
    container_name: client_classic
    volumes:
      - ./nginx-oqs/nginx_config/ssl/server.crt:/etc/ssl/certs/proxy_server.crt:ro
    networks:
      - frontend_net
    depends_on:
      - nginx-proxy-oqs
    stdin_open: true
    tty: true
