# nginx-oqs/nginx_config/conf/nginx.conf
user www-data;
worker_processes auto;
pid /var/run/nginx-oqs.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx-oqs/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" $ssl_protocol $ssl_cipher $ssl_curves';

    access_log  /var/log/nginx-oqs/access.log  main;
    error_log   /var/log/nginx-oqs/error.log warn; # warn für Debugging

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Include server blocks
    include /etc/nginx-oqs/sites-enabled/*;
    include /etc/nginx-oqs/sites-available/*; # Für einfacheres Management im Docker-Setup
}
