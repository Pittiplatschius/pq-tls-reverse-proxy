# nginx-pqc/nginx_config/conf/snippets/ssl-params.conf
ssl_protocols TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off; # Für Perfect Forward Secrecy

ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

# TLS 1.3 KEMs (Gruppen)
# Die Namen (z.B. mlkem768) müssen von Ihrer OpenSSL-Version unterstützt werden.
# Überprüfen Sie mit: /opt/openssl-pqc/bin/openssl list -kem-algorithms
# Oder für TLS 1.3 Gruppen: /opt/openssl-pqc/bin/openssl s_server -help (Suche nach -groups)
# Beispiel für OpenSSL 3.2+ (Kyber ist oft als 'mlkem768' oder ähnlich verfügbar)
ssl_conf_command Groups X25519MLKEM768:X25519;
# Für ältere OpenSSL 3.x Versionen könnte es auch über ssl_ecdh_curve gehen, aber Groups ist moderner.

# Optional: OCSP Stapling
# ssl_stapling on;
# ssl_stapling_verify on;
# ssl_trusted_certificate /etc/nginx-pq/ssl/ca_chain.pem; # Falls Sie eine CA-Kette haben
