# nginx-pq/nginx_config/conf/nginx.conf
user www-data;
worker_processes auto;
pid /var/run/nginx-pq.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx-pq/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" $ssl_protocol $ssl_cipher $ssl_curves';

    access_log  /var/log/nginx-pq/access.log  main;
    error_log   /var/log/nginx-pq/error.log debug; #Debug-Logging erzeugt sehr viele Einträge → nur für Testumgebung. alternative warn

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Include server blocks
    include /etc/nginx-pq/sites-enabled/*;
    include /etc/nginx-pq/sites-available/*;
}
