# nginx-pqc/nginx_config/conf/sites-available/pqc-proxy.conf
server {
    listen 80;
    listen [::]:80;
    server_name pqc.tls.proxy;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pqc.tls.proxy; # Muss mit dem CN im Zertifikat übereinstimmen

    # SSL Zertifikate
    ssl_certificate /etc/nginx-pq/ssl/server.crt;
    ssl_certificate_key /etc/nginx-pq/ssl/server.key;

    # SSL Parameter einbinden
    include snippets/ssl-params.conf;

    # Logging
    access_log /var/log/nginx-pq/access.log main;
    error_log /var/log/nginx-pq/error.log info; # info für mehr Details beim Testen

    location / {
        proxy_pass http://backend-server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
